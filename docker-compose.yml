services:
  web:
    build: .
    container_name: class_web
    restart: unless-stopped
    ports:
      - "${WEB_PORT}:80"
    volumes:
      - ./src:/var/www/html
    depends_on:
      database:
        condition: service_healthy
    networks:
      - app_net

  database:
    image: mysql:8.0
    container_name: class_db
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: "${DB_ROOT_PASS}"
      MYSQL_DATABASE: "${DB_NAME}"
      MYSQL_USER: "${DB_USER}"
      MYSQL_PASSWORD: "${DB_PASS}"
    volumes:
      - db_data:/var/lib/mysql
    networks:
      - app_net
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5

  phpmyadmin:
    image: phpmyadmin
    container_name: class_pma
    restart: unless-stopped
    ports:
      - "${PMA_PORT}:80"
    environment:
      PMA_HOST: database
    depends_on:
      - database
    networks:
      - app_net

volumes:
  db_data:

networks:
  app_net:
    driver: bridge